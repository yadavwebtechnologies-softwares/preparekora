name = "preparekora-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Workers AI binding — English → Assamese translation
# ============================================================
[ai]
binding = "AI"

# ============================================================
# Public configuration (safe to commit)
# ============================================================
[vars]
FIREBASE_PROJECT_ID = "preparekora"
FIREBASE_DB_URL = "https://preparekora-default-rtdb.firebaseio.com"

# ============================================================
# Secrets — DO NOT add here
# These are set via Cloudflare dashboard or `wrangler secret put`:
#
#   FIREBASE_SERVICE_ACCOUNT   — service account JSON (minified, one line)
#   ADMIN1_UID                 — Firebase Auth UID for admin 1
#   ADMIN2_UID                 — Firebase Auth UID for admin 2
# ============================================================
