<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef1f6">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — PrepareKora</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dash-loading {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dash-loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: pk-spin 0.7s linear infinite;
    }
    @keyframes pk-spin { to { transform: rotate(360deg); } }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .dash-user {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .dash-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(163, 177, 198, 0.35);
    }
    .dash-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dash-avatar-fallback {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
    }
    .dash-name {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }
    .dash-email {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .dash-empty {
      padding: 60px 20px;
      text-align: center;
      background: #ffffff;
      border: 1px solid rgba(216, 222, 232, 0.6);
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(163, 177, 198, 0.35);
    }
    .dash-empty h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 600;
    }
    .dash-empty p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .signout-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      background: #ffffff;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(163, 177, 198, 0.35);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .signout-btn:hover {
      box-shadow: 0 4px 12px rgba(163, 177, 198, 0.45);
      transform: translateY(-1px);
    }
    .signout-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(163, 177, 198, 0.4);
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="PrepareKora home">
        <span class="brand-main">preparekora</span><span class="brand-in">.in</span>
      </a>
      <button class="signout-btn" id="signOutBtn" type="button">
        Sign out
      </button>
    </div>
  </header>

  <main class="page-container">
    <div id="dashLoading" class="dash-loading">
      <div class="spinner"></div>
    </div>

    <div id="dashContent" hidden>
      <div class="dash-header">
        <div class="dash-user">
          <div class="dash-avatar" id="dashAvatar"></div>
          <div>
            <h1 class="dash-name" id="dashName">Welcome</h1>
            <p class="dash-email" id="dashEmail"></p>
          </div>
        </div>
      </div>

      <div class="dash-empty">
        <h2>Your daily quizzes will appear here</h2>
        <p>We're setting things up. Please check back soon.</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-brand">PrepareKora.in</a>
      <div class="footer-copy">© <span id="currentYear"></span> PrepareKora.in</div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="about.html">About</a>
        <a href="find-us.html">Find Us</a>
      </nav>
    </div>
  </footer>

  <script src="js/dashboard.js"></script>

</body>
</html>
