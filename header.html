<!-- StudyKora Shared Header -->
<header class="site-header">
    <div class="header-inner">

        <a href="./index.html" class="brand" aria-label="StudyKora home">
            <span class="brand-mark" aria-hidden="true">
                <span style="font-size:23px;font-weight:800;">s</span>
            </span>
            <span class="brand-text">
                <span class="brand-name"><span class="brand-name-primary">study</span><span class="brand-name-muted">kora</span></span>
            </span>
        </a>

        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
            <a href="./index.html" data-page="index.html">Home</a>
            <a href="./subject.html" data-page="subject.html">Subjects</a>
            <a href="./current-affairs.html" data-page="current-affairs.html">Current Affairs</a>
            <a href="./mock-tests.html" data-page="mock-tests.html">Mock Tests</a>
            <a href="./daily-practice.html" data-page="daily-practice.html">Daily Practice</a>
        </nav>

        <div class="header-actions">

            <!-- Visible when logged out -->
            <div id="account-guest" class="account-guest">
                <a href="./auth.html?mode=login" class="btn btn-outline">
                    Login
                </a>
                <a href="./auth.html?mode=signup" class="btn btn-primary">
                    Create Account
                </a>
            </div>

            <!-- Visible when logged in -->
            <div id="account-authenticated" class="account-authenticated" hidden>
                <a
                    href="./profile.html"
                    class="account-profile-trigger"
                    id="account-profile-trigger"
                    aria-label="Open profile"
                    title="Profile"
                >
                    <svg viewBox="0 0 24 24" width="21" height="21"
                         fill="none" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"
                                stroke="currentColor" stroke-width="1.7"/>
                        <path d="M4.5 20a7.5 7.5 0 0 1 15 0"
                              stroke="currentColor" stroke-width="1.7"
                              stroke-linecap="round"/>
                    </svg>
                </a>
            </div>

            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Open navigation menu"
                aria-controls="main-nav"
                aria-expanded="false"
            >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16"
                          stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round"/>
                </svg>
            </button>

        </div>
    </div>
</header>
