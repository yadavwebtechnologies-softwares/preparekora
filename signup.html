<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | StudyNow</title>
    <meta name="description" content="Create your StudyNow account to practice mock tests, revise subjects, and prepare for competitive exams.">
    <link rel="canonical" href="https://yadavwebtechnologies-softwares.github.io/studynow/signup.html">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand" aria-label="StudyNow Home">
                <span class="brand-name">StudyNow</span>
                <span class="brand-caption">Learn. Practice. Progress.</span>
            </a>

            <nav class="main-nav" id="main-nav" aria-label="Main navigation">
                <a href="index.html#current-affairs">Current Affairs</a>
                <a href="mock-tests.html">Mock Tests</a>
                <a href="subject.html">Subjects</a>
                <a href="daily-practice.html">Daily Practice</a>
            </nav>

            <div class="header-actions">
                <a href="login.html" class="btn btn-outline">Login</a>
            </div>

            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Toggle navigation"
                aria-controls="main-nav"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="content-section">
            <div class="section-heading">
                <span class="eyebrow">JOIN STUDYNOW</span>
                <h1 class="section-title">Create your account</h1>
                <p>Start your preparation and keep track of your progress.</p>
            </div>

            <div class="why-card">
                <form id="signup-form">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input
                            type="text"
                            id="full-name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <p id="signup-message" role="status" aria-live="polite"></p>

                    <button type="submit" class="btn btn-primary btn-full">
                        Create Account
                    </button>

                    <p>
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>Design and Develop by Yadav Web Technologies</p>
        </div>
    </footer>

    <script>
        const signupForm = document.getElementById("signup-form");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirm-password");
        const signupMessage = document.getElementById("signup-message");

        signupForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (passwordInput.value !== confirmPasswordInput.value) {
                signupMessage.textContent = "Passwords do not match.";
                confirmPasswordInput.focus();
                return;
            }

            signupMessage.textContent =
                "Account registration will be available when authentication is connected.";
        });
    </script>
</body>
</html>
