<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Ebook — PrepareKora.in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html"><span class="brand-main">preparekora</span><span class="brand-in">.in</span></a>
      <nav class="desktop-nav"><a href="index.html">Home</a></nav>
    </div>
  </header>

  <main class="page-container" id="ebookMain">
    <div class="loading-state" style="text-align:center;padding:60px 20px;">
      <div class="spinner" style="width:28px;height:28px;margin:0 auto;border-radius:50%;border:3px solid #e7e7e7;border-top-color:#737373;animation:pkSpin .8s linear infinite;"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-brand">PrepareKora.in</a>
      <div class="footer-copy">© <span id="currentYear"></span> PrepareKora.in</div>
    </div>
  </footer>

  <script>
  (function(){
    "use strict";
    var API_BASE = "https://preparekora-api.yadavsubba2003.workers.dev/api";
    var params = new URLSearchParams(location.search);
    var id = params.get("id") || "";
    var main = document.getElementById("ebookMain");
    document.getElementById("currentYear").textContent = new Date().getFullYear();

    function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){var m={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"};return m[c];}); }

    function notFound(msg) {
      main.innerHTML = '<div class="card" style="max-width:520px;margin:40px auto;text-align:center;">' +
        '<h1 style="font-size:22px;font-weight:600;margin:0 0 8px;">Ebook not found</h1>' +
        '<p class="muted-text" style="margin:0 0 20px;">' + esc(msg || "This ebook is unavailable.") + '</p>' +
        '<a href="index.html" class="btn btn-primary">Back to Home</a></div>';
    }

    if (!id) { notFound("No ebook ID provided."); return; }

    fetch(API_BASE + "/ebooks/" + encodeURIComponent(id), { headers: { Accept: "application/json" } })
      .then(function(r){ if (!r.ok) throw new Error(r.status === 404 ? "Not found" : "HTTP " + r.status); return r.json(); })
      .then(function(d){
        var e = d && d.ebook; if (!e) return notFound("Missing data.");
        render(e);
      })
      .catch(function(err){ notFound(err.message); });

    function render(e) {
      var priceLine = e.originalPrice > e.price
        ? '<span style="text-decoration:line-through;color:#737373;font-size:16px;margin-right:8px;">₹' + e.originalPrice + '</span><span style="font-size:26px;font-weight:700;">₹' + e.price + '</span>'
        : '<span style="font-size:26px;font-weight:700;">₹' + e.price + '</span>';
      var coverHtml = e.coverPath
        ? '<img src="' + esc(e.coverPath) + '" alt="' + esc(e.title) + '" style="width:100%;max-width:340px;border-radius:8px;border:1px solid #e7e7e7;display:block;">'
        : '<div style="width:100%;max-width:340px;aspect-ratio:3/4;background:#f7f7f7;border-radius:8px;border:1px solid #e7e7e7;display:grid;place-items:center;color:#737373;font-size:12px;">No cover</div>';

      var html = '<div style="max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start;" class="ebook-layout">' +
        '<div>' + coverHtml + '</div>' +
        '<div>' +
          '<h1 style="margin:0 0 8px;font-size:26px;font-weight:700;line-height:1.3;">' + esc(e.title) + '</h1>' +
          (e.category ? '<div style="font-size:12px;color:#737373;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;">' + esc(e.category) + '</div>' : '') +
          (e.description ? '<p style="margin:0 0 18px;font-size:14px;line-height:1.7;color:#525252;text-align:justify;">' + esc(e.description) + '</p>' : '') +
          '<div style="margin-bottom:20px;">' + priceLine + '</div>' +
          '<button class="btn btn-primary" type="button" id="ebookBuyBtn" style="width:100%;max-width:280px;padding:14px;font-size:14px;font-weight:600;">Buy on WhatsApp</button>' +
          '<p style="font-size:12px;color:#737373;margin-top:10px;">Payment and PDF delivery via WhatsApp.</p>' +
        '</div>' +
      '</div>' +
      '<style>@media(max-width:700px){.ebook-layout{grid-template-columns:1fr!important;}.ebook-layout>div:first-child{text-align:center;}.ebook-layout img{max-width:240px!important;margin:0 auto;}}</style>';

      var contentHtml = "";
      if (Array.isArray(e.sections) && e.sections.length) {
        contentHtml = '<div style="max-width:780px;margin:40px auto 0;">';
        e.sections.forEach(function(s){
          var t = s.type || "p", c = s.content || "";
          if (t === "h2") contentHtml += '<h2 style="font-size:20px;font-weight:700;margin:28px 0 12px;">' + esc(c) + '</h2>';
          else if (t === "h3") contentHtml += '<h3 style="font-size:16px;font-weight:600;margin:22px 0 10px;">' + esc(c) + '</h3>';
          else if (t === "list") contentHtml += '<ul style="margin:0 0 16px;padding-left:22px;font-size:14px;line-height:1.75;">' + c.split(/\n+/).filter(Boolean).map(function(li){return '<li>'+esc(li)+'</li>';}).join("") + '</ul>';
          else if (t === "numlist") contentHtml += '<ol style="margin:0 0 16px;padding-left:22px;font-size:14px;line-height:1.75;">' + c.split(/\n+/).filter(Boolean).map(function(li){return '<li>'+esc(li)+'</li>';}).join("") + '</ol>';
          else if (t === "highlight") contentHtml += '<div style="padding:14px 16px;margin:0 0 16px;border:1px solid #e7e7e7;border-left:3px solid #222222;border-radius:8px;background:#f7f7f7;font-size:14px;line-height:1.65;">' + esc(c) + '</div>';
          else if (t === "image") contentHtml += c ? '<div style="margin:16px 0;text-align:center;"><img src="' + esc(c) + '" style="max-width:100%;border-radius:8px;border:1px solid #e7e7e7;" alt=""></div>' : "";
          else contentHtml += '<p style="margin:0 0 14px;font-size:14px;line-height:1.75;color:#222222;text-align:justify;">' + esc(c) + '</p>';
        });
        contentHtml += '</div>';
      }

      main.innerHTML = html + contentHtml;

      var buyBtn = document.getElementById("ebookBuyBtn");
      if (buyBtn) buyBtn.addEventListener("click", function(){
        var phone = "917896579939";
        fetch(API_BASE + "/premium/plans").then(function(r){return r.json();}).then(function(j){
          if (j && j.config && j.config.whatsapp) phone = j.config.whatsapp;
        }).catch(function(){}).finally(function(){
          var msg = "Ebook Order\n\nBook: " + e.title + "\nID: " + e.id + "\nPrice: ₹" + e.price + "\n\nI would like to purchase this ebook. Please share payment details.";
          window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), "_blank");
        });
      });
    }
  })();
  </script>
</body>
</html>
