<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Explore ebooks and study materials on PrepareKora.in.">
  <title>Ebook — PrepareKora.in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-main">preparekora</span>
        <span class="brand-in">.in</span>
      </a>
      <nav class="desktop-nav">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="page-container" id="ebookMain">
    <div class="ebook-detail-loading">
      <div class="spinner"></div>
      <p>Loading ebook...</p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-brand">PrepareKora.in</a>
      <div class="footer-copy">
        © <span id="currentYear"></span> PrepareKora.in
      </div>
    </div>
  </footer>

  <script>
  (function () {
    "use strict";

    var API_BASE = "https://preparekora-api.yadavsubba2003.workers.dev/api";
    var FALLBACK_WHATSAPP = "917896579939";

    var params = new URLSearchParams(location.search);
    var ebookId = params.get("id") || "";
    var main = document.getElementById("ebookMain");

    var whatsappPhone = FALLBACK_WHATSAPP;

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();


    /* ---------------------------------
       SAFE HELPERS
    --------------------------------- */

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
        var map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return map[char];
      });
    }


    function safeUrl(value) {
      if (!value || typeof value !== "string") return "";

      try {
        var url = new URL(value, location.href);

        if (
          url.protocol !== "https:" &&
          url.protocol !== "http:"
        ) {
          return "";
        }

        return url.href;
      } catch (error) {
        return "";
      }
    }


    function formatPrice(value) {
      var number = Number(value);

      if (!Number.isFinite(number)) return "";

      return number.toLocaleString("en-IN", {
        maximumFractionDigits: 2
      });
    }


    function formatDate(value) {
      if (!value) return "";

      var date;

      if (typeof value === "number") {
        date = new Date(value < 1000000000000 ? value * 1000 : value);
      } else {
        date = new Date(value);
      }

      if (isNaN(date.getTime())) return "";

      return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }


    function notFound(message) {
      main.innerHTML =
        '<div class="ebook-detail-error">' +
          '<h1>Ebook not found</h1>' +
          '<p>' + esc(message || "This ebook is currently unavailable.") + '</p>' +
          '<a href="index.html" class="btn btn-primary">Back to Home</a>' +
        '</div>';
    }


    /* ---------------------------------
       BADGES
    --------------------------------- */

    function renderBadges(badges) {
      if (!Array.isArray(badges) || !badges.length) {
        return "";
      }

      var html = '<div class="ebook-detail-badges">';

      badges.forEach(function (item) {
        var label = typeof item === "string"
          ? item
          : item && (item.label || item.title);

        if (!label) return;

        html += '<span class="ebook-detail-badge">' +
          esc(label) +
        '</span>';
      });

      html += '</div>';

      return html;
    }


    /* ---------------------------------
       PRICE CARD
    --------------------------------- */

    function renderPrice(e) {
      var price = Number(e.price);
      var originalPrice = Number(e.originalPrice);

      var hasPrice = e.price !== undefined &&
        e.price !== null &&
        e.price !== "";

      var priceHtml = "";

      if (hasPrice && Number.isFinite(price)) {
        if (price === 0) {
          priceHtml = '<div class="ebook-detail-price">Free</div>';
        } else {
          priceHtml =
            '<div class="ebook-detail-price">₹' +
              formatPrice(price) +
            '</div>';
        }
      } else {
        priceHtml = '<div class="ebook-detail-price">Price unavailable</div>';
      }

      var offerHtml = "";

      if (
        hasPrice &&
        Number.isFinite(originalPrice) &&
        originalPrice > price &&
        price >= 0
      ) {
        var discount = Math.round(
          ((originalPrice - price) / originalPrice) * 100
        );

        offerHtml =
          '<div class="ebook-detail-price-offer">' +
            '<span class="ebook-detail-original-price">₹' +
              formatPrice(originalPrice) +
            '</span>' +
            (discount > 0
              ? '<span class="ebook-detail-discount">' +
                  discount + '% OFF' +
                '</span>'
              : '') +
          '</div>';
      }

      return (
        '<div class="ebook-detail-price-card">' +
          '<div class="ebook-detail-price-label">Price</div>' +
          priceHtml +
          offerHtml +
          '<button class="btn btn-primary" type="button" id="ebookBuyBtn">' +
            'Buy on WhatsApp' +
          '</button>' +
          '<p class="ebook-detail-payment-note">' +
            'Payment and PDF delivery via WhatsApp.' +
          '</p>' +
        '</div>'
      );
    }


    /* ---------------------------------
       FEATURES
    --------------------------------- */

    function renderFeatures(features) {
      if (!Array.isArray(features) || !features.length) {
        return "";
      }

      var validFeatures = features.filter(function (feature) {
        return feature &&
          (feature.title || feature.description);
      });

      if (!validFeatures.length) return "";

      var html =
        '<section class="ebook-detail-section">' +
          '<h2 class="ebook-detail-section-title">What\'s Included</h2>' +
          '<div class="ebook-detail-features-grid">';

      validFeatures.forEach(function (feature, index) {
        var icon = feature.icon || String(index + 1).padStart(2, "0");

        html +=
          '<article class="ebook-detail-feature-card">' +
            '<div class="ebook-detail-feature-icon">' +
              esc(icon) +
            '</div>' +
            '<div class="ebook-detail-feature-info">' +
              (feature.title
                ? '<h3>' + esc(feature.title) + '</h3>'
                : '') +
              (feature.description
                ? '<p>' + esc(feature.description) + '</p>'
                : '') +
            '</div>' +
          '</article>';
      });

      html +=
          '</div>' +
        '</section>';

      return html;
    }


    /* ---------------------------------
       TABLE OF CONTENTS
    --------------------------------- */

    function renderTOC(rows) {
      if (!Array.isArray(rows) || !rows.length) {
        return "";
      }

      var validRows = rows.filter(function (row) {
        return row && row.title;
      });

      if (!validRows.length) return "";

      var html =
        '<section class="ebook-detail-section">' +
          '<h2 class="ebook-detail-section-title">Table of Contents</h2>' +
          '<div class="ebook-detail-toc">';

      validRows.forEach(function (row, index) {
        var sampleUrl = safeUrl(row.sampleUrl);

        var sampleEnabled =
          row.freeSampleEnabled === true ||
          row.freeSample === true;

        var sampleHtml = "";

        if (sampleEnabled && sampleUrl) {
          sampleHtml =
            '<a class="ebook-detail-sample-btn" ' +
              'href="' + esc(sampleUrl) + '" ' +
              'target="_blank" rel="noopener noreferrer">' +
              'View Sample' +
            '</a>';
        }

        html +=
          '<div class="ebook-detail-toc-row">' +

            '<div class="ebook-detail-toc-number">' +
              String(index + 1).padStart(2, "0") +
            '</div>' +

            '<div class="ebook-detail-toc-info">' +
              '<h3>' + esc(row.title) + '</h3>' +

              (row.badge
                ? '<span class="ebook-detail-toc-badge">' +
                    esc(row.badge) +
                  '</span>'
                : '') +

              (row.pageRange
                ? '<span class="ebook-detail-page-range">' +
                    esc(row.pageRange) +
                  '</span>'
                : '') +
            '</div>' +

            '<div class="ebook-detail-toc-action">' +
              sampleHtml +
            '</div>' +

          '</div>';
      });

      html +=
          '</div>' +
        '</section>';

      return html;
    }


    /* ---------------------------------
       LEGACY CONTENT BLOCKS
       Existing e.sections remains supported.
    --------------------------------- */

    function renderLegacySections(sections) {
      if (!Array.isArray(sections) || !sections.length) {
        return "";
      }

      var html = '<section class="ebook-detail-content">';

      sections.forEach(function (section) {
        if (!section) return;

        var type = section.type || "p";
        var content = section.content || "";

        if (typeof content !== "string") {
          content = String(content);
        }

        if (!content.trim()) return;

        if (type === "h2") {
          html += '<h2>' + esc(content) + '</h2>';
        }

        else if (type === "h3") {
          html += '<h3>' + esc(content) + '</h3>';
        }

        else if (type === "list" || type === "numlist") {
          var items = content
            .split(/\n+/)
            .map(function (item) {
              return item.trim();
            })
            .filter(Boolean);

          var tag = type === "numlist" ? "ol" : "ul";

          html += '<' + tag + '>';

          items.forEach(function (item) {
            html += '<li>' + esc(item) + '</li>';
          });

          html += '</' + tag + '>';
        }

        else if (type === "highlight") {
          html +=
            '<div class="ebook-detail-highlight">' +
              esc(content) +
            '</div>';
        }

        else if (type === "image") {
          var imageUrl = safeUrl(content);

          if (imageUrl) {
            html +=
              '<div class="ebook-detail-content-image">' +
                '<img src="' + esc(imageUrl) + '" alt="" loading="lazy">' +
              '</div>';
          }
        }

        else {
          html += '<p>' + esc(content) + '</p>';
        }
      });

      html += '</section>';

      return html;
    }


    /* ---------------------------------
       MAIN EBOOK RENDERER
    --------------------------------- */

    function render(e) {
      var title = e.title || "Untitled Ebook";
      var author = e.authorName || e.author || "Sir Administrator";
      var updatedDate = formatDate(e.updatedAt);

      document.title = title + " — PrepareKora.in";

      var metaDescription = document.querySelector(
        'meta[name="description"]'
      );

      if (metaDescription && e.description) {
        metaDescription.setAttribute(
          "content",
          String(e.description).slice(0, 155)
        );
      }


      /* Cover */

      var coverUrl = safeUrl(e.coverPath);

      var coverHtml = coverUrl
        ? (
          '<div class="ebook-detail-cover-wrap">' +
            '<img ' +
              'class="ebook-detail-cover" ' +
              'src="' + esc(coverUrl) + '" ' +
              'alt="' + esc(title) + '" ' +
              'loading="eager" ' +
              'onerror="this.hidden=true;this.nextElementSibling.hidden=false;">' +

            '<div class="ebook-detail-cover-placeholder" hidden>' +
              'Cover unavailable' +
            '</div>' +
          '</div>'
        )
        : (
          '<div class="ebook-detail-cover-wrap">' +
            '<div class="ebook-detail-cover-placeholder">' +
              'No cover available' +
            '</div>' +
          '</div>'
        );


      /* Author and date */

      var authorMeta =
        '<div class="ebook-detail-author">' +
          'By ' + esc(author) +
          (updatedDate
            ? '<span class="ebook-detail-updated">Updated ' +
                esc(updatedDate) +
              '</span>'
            : '') +
        '</div>';


      /* Main hero */

      var heroHtml =
        '<div class="ebook-detail-breadcrumb">' +
          '<a href="index.html">Home</a>' +
          '<span>/</span>' +
          '<span>Ebooks</span>' +
          '<span>/</span>' +
          '<span>' + esc(title) + '</span>' +
        '</div>' +

        '<section class="ebook-detail-hero">' +

          '<div class="ebook-detail-cover-column">' +
            coverHtml +
          '</div>' +

          '<div class="ebook-detail-info">' +

            (e.category
              ? '<div class="ebook-detail-category">' +
                  esc(e.category) +
                '</div>'
              : '') +

            '<h1 class="ebook-detail-title">' +
              esc(title) +
            '</h1>' +

            authorMeta +

            (e.description
              ? '<p class="ebook-detail-description">' +
                  esc(e.description) +
                '</p>'
              : '') +

            renderBadges(e.badges) +

          '</div>' +

          '<div class="ebook-detail-price-column">' +
            renderPrice(e) +
          '</div>' +

        '</section>';


      /* Dynamic sections */

      var featuresHtml = renderFeatures(e.features);

      var tocHtml = renderTOC(e.tocSections);

      var legacyContentHtml = renderLegacySections(e.sections);


      main.innerHTML =
        '<div class="ebook-detail-page">' +
          heroHtml +
          '<div class="ebook-detail-divider"></div>' +
          featuresHtml +
          tocHtml +
          legacyContentHtml +
        '</div>';


      /* WhatsApp purchase */

      var buyBtn = document.getElementById("ebookBuyBtn");

      if (buyBtn) {
        buyBtn.addEventListener("click", function () {
          var phone = String(whatsappPhone).replace(/\D/g, "");

          var priceText = Number(e.price) === 0
            ? "Free"
            : (
                e.price !== undefined && e.price !== null
                  ? "₹" + formatPrice(e.price)
                  : "Not specified"
              );

          var message =
            "Ebook Order\n\n" +
            "Book: " + title + "\n" +
            "ID: " + (e.id || ebookId) + "\n" +
            "Price: " + priceText + "\n\n" +
            "I would like to purchase this ebook. Please share payment details.";

          var whatsappUrl =
            "https://wa.me/" +
            phone +
            "?text=" +
            encodeURIComponent(message);

          window.open(
            whatsappUrl,
            "_blank",
            "noopener,noreferrer"
          );
        });
      }
    }


    /* ---------------------------------
       INITIAL LOAD
    --------------------------------- */

    if (!ebookId) {
      notFound("No ebook ID was provided.");
      return;
    }


    /* Get configured WhatsApp number */

    fetch(API_BASE + "/premium/plans", {
      headers: {
        Accept: "application/json"
      }
    })
    .then(function (response) {
      if (!response.ok) throw new Error("WhatsApp settings unavailable");
      return response.json();
    })
    .then(function (data) {
      if (
        data &&
        data.config &&
        data.config.whatsapp
      ) {
        whatsappPhone = String(data.config.whatsapp);
      }
    })
    .catch(function () {
      /* Keep the existing fallback WhatsApp number. */
    });


    /* Fetch ebook */

    fetch(
      API_BASE + "/ebooks/" + encodeURIComponent(ebookId),
      {
        headers: {
          Accept: "application/json"
        }
      }
    )
    .then(function (response) {
      if (!response.ok) {
        throw new Error(
          response.status === 404
            ? "This ebook does not exist or is no longer published."
            : "Unable to load this ebook. Please try again."
        );
      }

      return response.json();
    })
    .then(function (data) {
      var ebook = data && data.ebook;

      if (!ebook) {
        notFound("Ebook information is missing.");
        return;
      }

      render(ebook);
    })
    .catch(function (error) {
      notFound(error.message);
    });

  })();
  </script>

</body>
</html>
