<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | preparekora.in</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-page">

<main class="admin-login-wrap">
    <div class="admin-login-card">
        <div class="admin-brand" style="padding: 0 0 20px; border-bottom: 0; margin: 0; justify-content: center;">
            <span class="admin-brand-main">preparekora</span><span class="admin-brand-domain">.in</span>
            <span class="admin-brand-tag">Admin</span>
        </div>
        <h1 class="admin-login-title">Administrator Login</h1>
        <p class="admin-login-sub">Sign in with your admin credentials.</p>
        <form id="admin-login-form" novalidate>
            <label class="admin-label">Email
                <input type="email" id="admin-login-email" class="admin-input"
                       autocomplete="username" required>
            </label>
            <label class="admin-label">Password
                <input type="password" id="admin-login-password" class="admin-input"
                       autocomplete="current-password" required>
            </label>
            <p class="admin-muted" id="admin-login-message"></p>
            <button type="submit" class="admin-btn admin-btn-primary admin-btn-full" id="admin-login-submit">Sign In</button>
        </form>
        <p class="admin-login-footer">
            <a href="../index.html">← Back to preparekora.in</a>
        </p>
    </div>
</main>

<script>
(() => {
    "use strict";
    const API = "https://studykora-api.yadavsubba2003.workers.dev";
    const SESSION_KEY = "preparekoraAdminSession";

    const form = document.getElementById("admin-login-form");
    const emailInput = document.getElementById("admin-login-email");
    const passwordInput = document.getElementById("admin-login-password");
    const message = document.getElementById("admin-login-message");
    const submit = document.getElementById("admin-login-submit");

    function setMsg(text, isError) {
        message.textContent = text || "";
        message.style.color = isError ? "#b42318" : "#6b6f76";
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg("");

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            setMsg("Enter a valid email address.", true); return;
        }
        if (!password) {
            setMsg("Enter your password.", true); return;
        }

        submit.disabled = true;
        submit.textContent = "Signing in…";

        try {
            const response = await fetch(`${API}/admin/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                if (response.status === 403) {
                    setMsg("This account is not authorized for admin access.", true);
                } else {
                    setMsg(data.error || "Sign in failed. Check your credentials.", true);
                }
                return;
            }

            if (!data.idToken || !data.user || !data.user.uid) {
                setMsg("Invalid response from server.", true);
                return;
            }

            const expiresIn = Number(data.expiresIn) || 3600;
            const savedAt = Date.now();
            const session = {
                idToken: data.idToken,
                refreshToken: data.refreshToken,
                expiresIn,
                savedAt,
                expiresAt: savedAt + expiresIn * 1000,
                user: data.user
            };

            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
            window.location.assign("index.html");
        } catch (error) {
            setMsg(error.message || "Unable to connect. Try again.", true);
        } finally {
            submit.disabled = false;
            submit.textContent = "Sign In";
        }
    });
})();
</script>
</body>
</html>
