<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef1f6">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — PrepareKora</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="PrepareKora home">
        <span class="brand-main">preparekora</span><span class="brand-in">.in</span>
      </a>
    </div>
  </header>

  <main class="page-container">

    <div class="page-heading">
      <h1>Sign in</h1>
      <p>Track your daily quizzes and progress</p>
    </div>

    <div class="card" style="max-width: 440px;">

      <p class="eyebrow">Welcome back</p>

      <div id="authLoading" class="loading-state" style="padding: 24px 0;">
        <div class="spinner"></div>
        <span>Loading…</span>
      </div>

      <button id="googleBtn" class="btn btn-primary" type="button" style="display: none; width: 100%; gap: 10px; padding: 12px 18px;">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px;">
          <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#ffffff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#ffffff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="form-error" id="authError" hidden></p>

      <p class="form-hint" style="margin-top: 18px;">
        By continuing, you agree to our <a href="terms.html" style="color: var(--accent); text-decoration: underline;">Terms &amp; Privacy</a>.
      </p>

    </div>

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-brand">PrepareKora.in</a>
      <div class="footer-copy">© <span id="currentYear"></span> PrepareKora.in</div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="about.html">About</a>
        <a href="find-us.html">Find Us</a>
      </nav>
    </div>
  </footer>

  <!-- Firebase SDK (modular, CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

    const API_BASE = (function () {
      const host = window.location.hostname;
      const isLocal = host === "localhost" || host === "127.0.0.1" || host === "0.0.0.0" || host === "" || host.endsWith(".local");
      return isLocal ? "http://localhost:8787/api" : "https://preparekora-api.yadavsubba2003.workers.dev/api";
    })();

    const TOKEN_KEY = "pk_user_id_token";
    const EXPIRES_KEY = "pk_user_expires_at";

    const $id = (id) => document.getElementById(id);
    const loadingEl = $id("authLoading");
    const googleBtn = $id("googleBtn");
    const errorEl = $id("authError");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }

    function clearError() {
      errorEl.hidden = true;
    }

    async function fetchAuthConfig() {
      const res = await fetch(API_BASE + "/auth/config", { method: "GET" });
      if (!res.ok) throw new Error("Could not load auth config");
      const data = await res.json();
      if (!data || !data.apiKey) throw new Error("Invalid auth config");
      return data;
    }

    async function syncProfileWithWorker(idToken) {
      const res = await fetch(API_BASE + "/user/profile", {
        method: "GET",
        headers: { "Authorization": "Bearer " + idToken }
      });
      if (!res.ok) throw new Error("Could not sync profile");
      return await res.json();
    }

    async function init() {
      $id("currentYear").textContent = new Date().getFullYear();

      try {
        const config = await fetchAuthConfig();
        const app = initializeApp(config);
        const auth = getAuth(app);

        try {
          await setPersistence(auth, browserLocalPersistence);
        } catch (e) {}

        loadingEl.style.display = "none";
        googleBtn.style.display = "inline-flex";

        onAuthStateChanged(auth, async (user) => {
          if (user) {
            try {
              const idToken = await user.getIdToken(true);
              try {
                localStorage.setItem(TOKEN_KEY, idToken);
                const exp = user.stsTokenManager && user.stsTokenManager.expirationTime;
                if (exp) localStorage.setItem(EXPIRES_KEY, String(exp));
              } catch (e) {}
              await syncProfileWithWorker(idToken);
              window.location.replace("dashboard.html");
            } catch (e) {}
          }
        });

        googleBtn.addEventListener("click", async () => {
          clearError();
          googleBtn.disabled = true;
          try {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: "select_account" });
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            const idToken = await user.getIdToken(true);
            try {
              localStorage.setItem(TOKEN_KEY, idToken);
              const exp = user.stsTokenManager && user.stsTokenManager.expirationTime;
              if (exp) localStorage.setItem(EXPIRES_KEY, String(exp));
            } catch (e) {}
            await syncProfileWithWorker(idToken);
            window.location.replace("dashboard.html");
          } catch (err) {
            const code = err && err.code ? String(err.code) : "";
            if (code === "auth/popup-closed-by-user") {
              // silent
            } else if (code === "auth/popup-blocked") {
              showError("Popup blocked by browser. Please allow popups and try again.");
            } else if (code === "auth/unauthorized-domain") {
              showError("This domain is not authorized. Please contact support.");
            } else {
              showError((err && err.message) || "Sign-in failed. Please try again.");
            }
          } finally {
            googleBtn.disabled = false;
          }
        });

      } catch (err) {
        loadingEl.style.display = "none";
        showError((err && err.message) || "Could not start sign-in. Please refresh.");
      }
    }

    init();
  </script>

</body>
</html>
