<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Login or create your StudyNow account to continue competitive exam preparation."
    >

    <title>Login — StudyNow</title>

    <link rel="stylesheet" href="style.css">
    <script src="js/login.js" defer></script>
</head>

<body class="auth-page">

    <header class="auth-header">
        <a href="index.html" class="brand" aria-label="StudyNow Home">
            <span class="brand-name">StudyNow</span>
            <span class="brand-caption">Learn. Practice. Progress.</span>
        </a>

        <a href="index.html" class="auth-home-link">
            Back to Home
        </a>
    </header>

    <main class="auth-main">

        <section class="auth-card" aria-labelledby="auth-title">

            <div class="auth-heading">
                <span class="eyebrow">YOUR STUDYNOW ACCOUNT</span>

                <h1 id="auth-title">Welcome back</h1>

                <p id="auth-description">
                    Sign in to continue your exam preparation.
                </p>
            </div>

            <form id="auth-form" novalidate>

                <div class="auth-field" id="name-field" hidden>
                    <label for="auth-name">Full name</label>

                    <input
                        type="text"
                        id="auth-name"
                        name="name"
                        autocomplete="name"
                        placeholder="Enter your full name"
                    >
                </div>

                <div class="auth-field">
                    <label for="auth-email">Email address</label>

                    <input
                        type="email"
                        id="auth-email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="auth-password">Password</label>

                    <input
                        type="password"
                        id="auth-password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                    <p class="auth-hint">
                        Password must contain at least 6 characters.
                    </p>
                </div>

                <div class="auth-options" id="login-options">
                    <button
                        type="button"
                        class="auth-text-button"
                        id="forgot-password"
                    >
                        Forgot password?
                    </button>
                </div>

                <p
                    class="auth-message"
                    id="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="auth-submit"
                >
                    Login
                </button>

            </form>

            <div class="auth-switch">
                <span id="auth-switch-text">New to StudyNow?</span>

                <button
                    type="button"
                    class="auth-text-button"
                    id="auth-switch-button"
                >
                    Create an account
                </button>
            </div>

        </section>

        <p class="auth-footer-note">
            Design and Develop by Yadav Web Technologies
        </p>

    </main>

</body>
</html>
