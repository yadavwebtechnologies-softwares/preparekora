<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef1f6">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — PrepareKora</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-screen {
      min-height: calc(100vh - 130px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      background: #ffffff;
      border: 1px solid rgba(216, 222, 232, 0.6);
      border-radius: 18px;
      box-shadow:
        0 12px 30px rgba(163, 177, 198, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      text-align: center;
    }
    .auth-brand {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.7px;
      margin-bottom: 6px;
    }
    .auth-brand-main { color: #111111; }
    .auth-brand-in { color: #858585; }
    .auth-welcome {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }
    .auth-subtitle {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .google-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      background: #ffffff;
      border: 1px solid rgba(216, 222, 232, 0.8);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: box-shadow 0.15s ease, transform 0.15s ease, background 0.15s ease;
      box-shadow:
        0 4px 12px rgba(163, 177, 198, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }
    .google-btn:hover {
      background: #f9fafb;
      box-shadow:
        0 6px 16px rgba(163, 177, 198, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
    }
    .google-btn:active {
      transform: translateY(0);
      box-shadow:
        0 2px 6px rgba(163, 177, 198, 0.4),
        inset 0 2px 5px rgba(163, 177, 198, 0.35);
    }
    .google-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    .google-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .auth-error {
      margin: 16px 0 0;
      padding: 10px 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 12px;
      text-align: left;
      line-height: 1.5;
    }
    .auth-terms {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .auth-terms a {
      color: var(--accent);
      text-decoration: underline;
    }
    .auth-loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-loading .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: pk-spin 0.7s linear infinite;
    }
    @keyframes pk-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="PrepareKora home">
        <span class="brand-main">preparekora</span><span class="brand-in">.in</span>
      </a>
    </div>
  </header>

  <main class="page-container">
    <div class="auth-screen">
      <div class="auth-card">

        <div class="auth-brand">
          <span class="auth-brand-main">preparekora</span><span class="auth-brand-in">.in</span>
        </div>

        <h1 class="auth-welcome">Welcome back</h1>
        <p class="auth-subtitle">Sign in to track your daily quizzes and progress</p>

        <div id="authLoading" class="auth-loading">
          <div class="spinner"></div>
          <span>Loading…</span>
        </div>

        <button id="googleBtn" class="google-btn" type="button" style="display: none;">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth-error" id="authError" hidden></p>

        <p class="auth-terms">
          By continuing, you agree to our
          <a href="terms.html">Terms &amp; Privacy</a>.
        </p>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-brand">PrepareKora.in</a>
      <div class="footer-copy">© <span id="currentYear"></span> PrepareKora.in</div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="about.html">About</a>
        <a href="find-us.html">Find Us</a>
      </nav>
    </div>
  </footer>

  <!-- Firebase SDK (modular, CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

    const API_BASE = (function () {
      const host = window.location.hostname;
      const isLocal = host === "localhost" || host === "127.0.0.1" || host === "0.0.0.0" || host === "" || host.endsWith(".local");
      return isLocal ? "http://localhost:8787/api" : "https://preparekora-api.yadavsubba2003.workers.dev/api";
    })();

    const TOKEN_KEY = "pk_user_id_token";
    const EXPIRES_KEY = "pk_user_expires_at";

    const $id = (id) => document.getElementById(id);
    const loadingEl = $id("authLoading");
    const googleBtn = $id("googleBtn");
    const errorEl = $id("authError");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }

    function clearError() {
      errorEl.hidden = true;
    }

    async function fetchAuthConfig() {
      const res = await fetch(API_BASE + "/auth/config", { method: "GET" });
      if (!res.ok) throw new Error("Could not load auth config");
      const data = await res.json();
      if (!data || !data.apiKey) throw new Error("Invalid auth config");
      return data;
    }

    async function syncProfileWithWorker(idToken) {
      const res = await fetch(API_BASE + "/user/profile", {
        method: "GET",
        headers: { "Authorization": "Bearer " + idToken }
      });
      if (!res.ok) throw new Error("Could not sync profile");
      return await res.json();
    }

    async function init() {
      $id("currentYear").textContent = new Date().getFullYear();

      try {
        // 1. Fetch config from Worker
        const config = await fetchAuthConfig();

        // 2. Initialize Firebase SDK
        const app = initializeApp(config);
        const auth = getAuth(app);

        try {
          await setPersistence(auth, browserLocalPersistence);
        } catch (e) {}

        // 3. Hide loading, show button
        loadingEl.style.display = "none";
        googleBtn.style.display = "inline-flex";

                // 3.5 Check logout flag — force Firebase signOut before redirect
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("logout") === "1") {
          try {
            const { signOut } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");
            await signOut(auth);
          } catch (e) {}
          window.history.replaceState({}, "", window.location.pathname);
        }

        // 4. If already signed in → redirect to dashboard
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            try {
              const idToken = await user.getIdToken(true);
              try {
                localStorage.setItem(TOKEN_KEY, idToken);
                const exp = user.stsTokenManager && user.stsTokenManager.expirationTime;
                if (exp) localStorage.setItem(EXPIRES_KEY, String(exp));
              } catch (e) {}
            await syncProfileWithWorker(idToken);
            const redirect = (function () {
              try {
                const r = sessionStorage.getItem("pk_post_login_redirect");
                if (r) {
                  sessionStorage.removeItem("pk_post_login_redirect");
                  return r;
                }
              } catch (e) {}
              return "dashboard.html";
            })();
            window.location.replace(redirect);
            } catch (e) {
              // Profile sync failed — let user retry
            }
          }
        });

        // 5. Google button click
        googleBtn.addEventListener("click", async () => {
          clearError();
          googleBtn.disabled = true;
          try {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: "select_account" });
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            const idToken = await user.getIdToken(true);
            try {
              localStorage.setItem(TOKEN_KEY, idToken);
              const exp = user.stsTokenManager && user.stsTokenManager.expirationTime;
              if (exp) localStorage.setItem(EXPIRES_KEY, String(exp));
            } catch (e) {}
            await syncProfileWithWorker(idToken);
            const redirect = (function () {
              try {
                const r = sessionStorage.getItem("pk_post_login_redirect");
                if (r) {
                  sessionStorage.removeItem("pk_post_login_redirect");
                  return r;
                }
              } catch (e) {}
              return "dashboard.html";
            })();
            window.location.replace(redirect);
          } catch (err) {
            const code = err && err.code ? String(err.code) : "";
            if (code === "auth/popup-closed-by-user") {
              // Silent — user cancelled
            } else if (code === "auth/popup-blocked") {
              showError("Popup blocked by browser. Please allow popups for this site and try again.");
            } else if (code === "auth/unauthorized-domain") {
              showError("This domain is not authorized. Please contact support.");
            } else {
              showError((err && err.message) || "Sign-in failed. Please try again.");
            }
          } finally {
            googleBtn.disabled = false;
          }
        });

      } catch (err) {
        loadingEl.style.display = "none";
        showError((err && err.message) || "Could not start sign-in. Please refresh.");
      }
    }

    init();
  </script>

</body>
</html>
